          var ogUrlEl = document.querySelector('meta[property="og:url"]');

        try {
          var saved = localStorage.getItem('tx_tour_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }

        // Early capture of native Chrome PWA install prompt
        window.__TX_DEFERRED_PROMPT__ = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__TX_DEFERRED_PROMPT__ = e;
        });
        window.addEventListener('appinstalled', function () {
          window.__TX_DEFERRED_PROMPT__ = null;
        });

        // Automatic Top-Level Frame Breakout:
        // If opened inside AI Studio outer container/iframe, redirect the top window to the direct standalone app URL
        // to immediately remove the AI Studio header, prompt bar, chat, and share controls!

          if (window.top && window.top !== window.self) {

                el.remove();
              }
            });

                if (child.id === 'root') return;
                var txt = (child.textContent || '').toLowerCase();
                var html = (child.innerHTML || '').toLowerCase();
                if (txt.indexOf('powered by netlify') !== -1 || html.indexOf('netlify') !== -1) {
                  child.remove();
                }
              });
            }
